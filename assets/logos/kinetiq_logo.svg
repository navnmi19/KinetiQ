<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <!-- Smooth premium orange gradient -->
    <linearGradient id="orangeK" x1="70" y1="70" x2="410" y2="440"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD86A"/>
      <stop offset="0.25" stop-color="#FFB52E"/>
      <stop offset="0.55" stop-color="#FF8A00"/>
      <stop offset="0.82" stop-color="#FF7000"/>
      <stop offset="1" stop-color="#F45100"/>
    </linearGradient>

    <linearGradient id="orangeQ" x1="430" y1="80" x2="180" y2="440"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.25" stop-color="#FFB72F"/>
      <stop offset="0.55" stop-color="#FF8A00"/>
      <stop offset="0.82" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#F04B00"/>
    </linearGradient>

    <!-- Soft white metallic gradient -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F7F7F7"/>
      <stop offset="0.75" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#CFCFCF"/>
    </linearGradient>

    <!-- Soft orange highlight -->
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft shadow without any black fill -->
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7"
                    flood-color="#7A3B00" flood-opacity="0.18"/>
    </filter>

    <filter id="metalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#8A8A8A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Smooth flowing K -->
  <g filter="url(#softShadow)">
    <path
      d="M92 78
         C92 69 99 62 108 62
         H157
         C166 62 173 69 173 78
         V215
         L306 78
         C312 72 320 69 329 69
         H378
         C391 69 398 84 389 94
         L257 229
         L391 410
         C400 422 391 439 376 439
         H326
         C318 439 311 435 306 428
         L210 300
         L173 338
         V423
         C173 432 166 439 157 439
         H108
         C99 439 92 432 92 423
         Z"
      fill="url(#orangeK)"/>

    <!-- soft highlight -->
    <path
      d="M108 62
         H157
         V215
         L306 78
         C312 72 320 69 329 69
         H351
         L191 239
         L108 324
         Z"
      fill="url(#highlight)"
      opacity="0.55"/>
  </g>

  <!-- Smooth Q ring -->
  <g filter="url(#softShadow)">
    <path
      d="M341 69
         C415 69 472 130 472 219
         C472 270 454 314 423 344
         L389 309
         C408 287 419 256 419 219
         C419 164 386 123 341 123
         C296 123 263 164 263 219
         C263 274 296 315 341 315
         C352 315 363 313 373 308
         L409 344
         C389 360 366 369 341 369
         C266 369 210 307 210 219
         C210 130 266 69 341 69
         Z"
      fill="url(#orangeQ)"/>

    <!-- Smooth Q tail -->
    <path
      d="M364 301
         C374 296 384 289 392 280
         L452 354
         C457 360 457 369 451 375
         L419 407
         C413 413 403 412 398 405
         L342 335
         C351 325 359 314 364 301
         Z"
      fill="url(#orangeQ)"/>

    <path
      d="M341 69
         C415 69 472 130 472 219
         C472 242 468 263 461 282
         C464 260 465 238 465 219
         C465 135 411 76 341 76
         Z"
      fill="url(#highlight)"
      opacity="0.6"/>
  </g>

  <!-- White dumbbell -->
  <g filter="url(#metalShadow)">
    <!-- shaft -->
    <rect x="270" y="207" width="112" height="25" rx="12.5"
          fill="url(#metal)"/>

    <!-- left weights -->
    <rect x="245" y="188" width="17" height="63" rx="8.5"
          fill="url(#metal)"/>
    <rect x="257" y="177" width="21" height="85" rx="10.5"
          fill="url(#metal)"/>
    <rect x="274" y="169" width="25" height="101" rx="12.5"
          fill="url(#metal)"/>

    <!-- right weights -->
    <rect x="367" y="169" width="25" height="101" rx="12.5"
          fill="url(#metal)"/>
    <rect x="388" y="177" width="21" height="85" rx="10.5"
          fill="url(#metal)"/>
    <rect x="409" y="188" width="17" height="63" rx="8.5"
          fill="url(#metal)"/>
  </g>

</svg>
